<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Subscribe</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">
      <section class="flex items-center justify-center h-screen bg-zinc-700">
        <div class="bg-zinc-800 p-2 mx-6 rounded-2xl">
          <div class="flex flex-col md:flex-row rounded-l-xl overflow-hidden">
            <img
              class="object-cover rounded-xl h-80 w-full md:h-64 md:rounded-l-xl md:w-1/3 md:ml-6 md:rounded-r-none transform hover:scale-105 hover:rounded-xl duration-200"
              src="https://images.unsplash.com/photo-1761839257946-4616bcfafec7?w=700&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxfHx8ZW58MHx8fHx8"
              alt="image3"
            />

            <div class="p-6 md:p-12">
              <h2
                class="font-serif text-xl font-medium text-center text-white md:text-left"
              >
                Get diet and fitness tips in your inbox
              </h2>
              <p
                class="text-white my-4 max-w-xs text-xs leading-5 tracking-wide text-center md:text-left"
              >
                Eat better and exercise better. Sign up for the Diet & Fitness
                newsletter.
              </p>
              <div
                class="flex flex-col mt-5 space-y-4 md:space-x-3 md:flex-row md:space-y-0 items-start justify-start"
              >
                <input
                  class="p-2 px-4 text-white bg-zinc-800 border border-zinc-600 placeholder:text-xs placeholder:text-center placeholder:md:text-left focus:outline-none"
                  type="email"
                  placeholder="Enter your email address"
                />
                <button
                  class="px-5 py-3 text-xs rounded-md text-zinc-800 bg-lime-500 hover:bg-lime-700 hover:text-white duration-500"
                >
                  Subscribe
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const { createApp, ref } = Vue;

      const app = createApp({
        setup() {
          const message = ref("Hello vue!");
          return {
            message,
          };
        },
      });

      app.component("main-component", {
        template: `
          
        `,
      });

      app.mount("#app");
    </script>
  </body>
</html>
