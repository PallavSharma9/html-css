<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image-gallery</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- Main container  -->
    <div class="flex items-center justify-center min-h-screen bg-pink-50 px-6">
      <div
        class="rounded-3xl shadow-2xl p-6 bg-white space-y-10 md:p-40 w-full max-w-6xl mx-auto"
      >
        <!-- Navbar  -->
        <div
          class="flex flex-col items-center justify-center space-y-3 md:flex-row md:justify-end w-full md:space-y-0 md:space-x-8 md:mb-24"
        >
          <!-- navbar items  -->
          <div class="group">
            <a href="#">Vector</a>
            <div
              class="mx-2 mt-2 duration-500 border-b-2 opacity-0 border-black group-hover:opacity-100"
            ></div>
          </div>
          <div class="group">
            <a href="#">Illustrations</a>
            <div
              class="mx-2 mt-2 duration-500 border-b-2 opacity-0 border-black group-hover:opacity-100"
            ></div>
          </div>
          <div class="group">
            <a href="#">Images</a>
            <div
              class="mx-2 mt-2 duration-500 border-b-2 opacity-0 border-black group-hover:opacity-100"
            ></div>
          </div>
          <div class="group">
            <a href="#">Icons</a>
            <div
              class="mx-2 mt-2 duration-500 border-b-2 opacity-0 border-black group-hover:opacity-100"
            ></div>
          </div>
        </div>

        <!-- search section  -->
        <div
          class="w-full flex flex-col md:justify-between space-y-5 md:flex-row md:space-y-0"
        >
          <div class="relative">
            <input
              type="text"
              placeholder="Search"
              class="w-96 md:w-80 border-b border-zinc-300 text-zinc-500 bg-transparent outline-none px-4 py-2"
            />
            <i
              class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400"
            ></i>
          </div>
          <button
            class="py-3 px-14 text-lg text-white bg-black border border-black rounded-md shadow-2xl duration-200 hover:bg-white hover:text-black"
          >
            Upload
          </button>
        </div>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-3 lg:grid-cols-4">
          <div class="relative group">
            <img src="./images/image1.jpg" alt="image 1" />
            <div
              class="absolute bottom-0 left-0 right-0 p-2 px-4 text-white duration-500 bg-black opacity-0 group-hover:opacity-100 bg-opacity-40"
            >
              <div class="flex justify-between w-full">
                <div class="font-normal">
                  <p class="text-sm">Abstract painting</p>
                  <p class="text-xs">245 likes - 35 Shares</p>
                </div>
                <div class="flex items-center">
                  <img src="images/bookmark.svg" alt="bookmark" />
                </div>
              </div>
            </div>
          </div>
          <div class="relative group">
            <img src="./images/image2.jpg" alt="image 1" />
            <div

                </div>

                </div>

          </div>
          <div class="relative group">

            <div

                </div>
                <div class="flex items-center">

          </div>
          <div class="relative group">

            <div

        </div>
      </div>
    </div>
  </body>
</html>
