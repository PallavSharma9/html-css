<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- container -->
    <div
      class="flex flex-col justify-center bg-[#222] items-center space-y-6 md:space-y-0 md:flex-row md:space-x-6 p-8 h-full md:h-screen"
    >
      <div
        class="flex flex-col justify-center items-center text-white bg-[#222] items-center border-8 border-zinc-700 rounded-xl"
      >
        <p class="my-6">BASIC</p>
        <h1 class="text-4xl font-bold mb-4">
          100<span class="text-5xl">GB</span>
        </h1>
        <p class="mb-8">$1.99/Month</p>
        <button
          class="px-10 py-3 border-2 border-pink-700 rounded-xl hover:bg-pink-700 hover:text-white mb-16"
        >
          Purchase
        </button>
        <div class="h-[0.5px] w-64 bg-zinc-500 mb-10"></div>
        <p>100 GB of storage</p>
        <p class="my-1">Option to add members</p>
        <p class="mb-8">Extra member benefits</p>
      </div>

      <div
        class="flex flex-col justify-center items-center text-white bg-[#222] items-center border-8 border-pink-700 rounded-xl"
      >
        <p class="my-6">STANDARD</p>
        <h1 class="text-4xl font-bold mb-4">
          200<span class="text-5xl">GB</span>
        </h1>
        <p class="mb-8">$3.99/Month</p>
        <button
          class="px-10 py-3 border-2 border-pink-700 bg-pink-700 rounded-xl hover:bg-pink-900 hover:border-pink-900 mb-16"
        >
          Purchase
        </button>
        <div class="h-[0.5px] w-64 bg-zinc-500 mb-10"></div>
        <p>200 GB of storage</p>
        <p class="my-1">Option to add members</p>
        <p class="mb-8">Extra member benefits</p>
      </div>

      <div
        class="flex flex-col justify-center items-center text-white bg-[#222] items-center border-8 border-zinc-500 rounded-xl"
      >
        <p class="my-6">PREMIUM</p>
        <h1 class="text-4xl font-bold mb-4">
          2 <span class="text-5xl">TB</span>
        </h1>
        <p class="mb-8">$8.99/Month</p>
        <button
          class="px-10 py-3 border-2 border-pink-700 rounded-xl hover:bg-pink-700 hover:text-white mb-16"
        >
          Purchase
        </button>
        <div class="h-[0.5px] w-64 bg-zinc-500 mb-10"></div>
        <p>2 TB of storage</p>
        <p class="my-1">Option to add members</p>
        <p class="mb-8">Extra member benefits</p>
      </div>
    </div>
  </body>
</html>
