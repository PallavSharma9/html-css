<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div
      class="container max-w-[700px] mt-20 mx-auto rounded-xl shadow-2xl p-10"
    >
      <div
        class="flex flex-col justify-center items-center p-4 md:flex-row md:space-x-4"
      >
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQb836dE7n6zzwt1Trmp97DPyLzM-QQM_A7w&s"
          alt="Product"
        />

        <div>
          <span class="text-xs bg-black text-white px-3 py-1 rounded-2xl"
            >Free Shipping</span
          >
          <h1 class="text-xl mt-2">IPhone 16</h1>
          <p class="text-xs line-through text-zinc-800 font-semibold mt-6">
            $700
          </p>
          <h1 class="text-3xl font-bold my-2">$599</h1>
          <p class="text-xs text-zinc-500">
            The offer is valid until Jan 20 or as long as stock lasts!
          </p>
          <button
            class="w-full bg-sky-600 text-white my-3 py-3 rounded-xl border-b-[6px] border-sky-800 hover:bg-sky-800"
          >
            Add to cart
          </button>
          <div class="my-2 flex justify-start space-x-2">
            <div class="p-2 bg-green-500 rounded-full"></div>
            <p class="text-zinc-800 text-xs">50+ pcs. in stock</p>
          </div>

          <div class="flex space-x-4 mt-8">
            <button
              class="outline outline-2 outline-zinc-300 py-2 px-3 rounded-sm flex space-x-2 items-center"
            >
              <i class="fa-solid fa-scale-balanced"></i>
              <span>Add to cart</span>
            </button>
            <button
              class="outline outline-2 outline-zinc-300 py-2 px-3 rounded-sm flex space-x-2 items-center"
            >
              <i class="fa-regular fa-heart text-xl"></i>
              <span>Add to wishlisht</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
